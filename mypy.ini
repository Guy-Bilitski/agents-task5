# =============================================================================
# mypy Configuration
# =============================================================================
#
# mypy is a static type checker for Python that helps catch bugs
# before runtime by verifying type annotations.
#
# Run with: mypy .
# Run with specific path: mypy common/

[mypy]
# Python version to target
python_version = 3.10

# Paths to check
files = common/, task1_experiment/, task2_experiment/, task3_experiment/, task4_experiment/

# Exclude directories
exclude = (?x)(
    ^venv/
    | ^\.venv/
    | ^build/
    | ^dist/
    | ^__pycache__/
    | ^\.git/
    | ^\.mypy_cache/
  )

# =============================================================================
# Import Discovery
# =============================================================================
# Ignore missing imports for third-party libraries
ignore_missing_imports = True

# Follow imports
follow_imports = normal

# =============================================================================
# Type Checking Strictness
# =============================================================================
# Warn about returning Any from functions
warn_return_any = True

# Warn about unused configs
warn_unused_configs = True

# Warn about redundant casts
warn_redundant_casts = True

# Warn about unused ignores
warn_unused_ignores = True

# Strict equality checking
strict_equality = True

# Check untyped function bodies
check_untyped_defs = True

# Require type annotations for function definitions
disallow_untyped_defs = False

# Disallow incomplete function definitions
disallow_incomplete_defs = True

# No implicit Optional
no_implicit_optional = True

# =============================================================================
# Error Reporting
# =============================================================================
# Show error codes
show_error_codes = True

# Show column numbers
show_column_numbers = True

# Pretty output
pretty = True

# Error message format
error_summary = True

# =============================================================================
# Per-Module Configuration
# =============================================================================
[mypy-faiss]
ignore_missing_imports = True

[mypy-faiss.*]
ignore_missing_imports = True

[mypy-sentence_transformers]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-matplotlib]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-numpy]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-torch]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-tests.*]
# Tests can be less strict
disallow_untyped_defs = False
check_untyped_defs = False
